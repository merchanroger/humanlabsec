<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas de salud | LABS</title><link rel="stylesheet" href="../styles.css"></head><body><script>document.write(header('noticias'))</script><section class="pageHero"><div class="wrap"><h1>Notas de salud</h1><p>Contenido educativo de LABS para pacientes y familias.</p></div></section><main class="section"><div class="wrap"><div class="searchBox"><input id="search" placeholder="Buscar aquí"><button class="btn primary" id="searchBtn">Buscar</button></div><div class="noteGrid" id="notes"></div></div></main><script>document.write(footer())</script><script src="../script.js"></script><script>function render(list){document.getElementById('notes').innerHTML=list.map(n=>`<a class="noteCard" href="${n.slug}/"><img src="../${n.img}" alt="${n.title}"><div class="noteBody"><div class="date">${n.date} · ${n.tag}</div><h3>${n.title}</h3><p>${n.intro}</p></div></a>`).join('')}render(notes);function search(){const q=document.getElementById('search').value.toLowerCase();render(notes.filter(n=>(n.title+' '+n.tag+' '+n.intro).toLowerCase().includes(q)))}document.getElementById('searchBtn').onclick=search;document.getElementById('search').oninput=search;init();</script></body></html>
